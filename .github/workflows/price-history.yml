# Relève chaque jour les prix Cardmarket dans l'historique Supabase (courbes de prix de l'app).
# Secrets du repo nécessaires : SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY
# (Settings → Secrets and variables → Actions). Table : docs/supabase-price-history.sql.
# Lançable aussi à la main : onglet Actions → « Price history » → Run workflow.
name: Price history

on:
  schedule:
    - cron: '30 6 * * *' # chaque jour à 6 h 30 UTC (Cardmarket publie son relevé vers 2 h, heure de Paris)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Relevé du jour
        run: node scripts/update-price-history.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
